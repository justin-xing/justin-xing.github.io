<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Justin's space, shared with love" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Justin's Space</title>
    <!--
      Set the theme before first paint, so a dark-mode visitor never sees a
      white flash. Runs synchronously and deliberately ahead of the app bundle.
      Mirrors the logic in src/store/darkMode.js.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark =
            saved === "dark" ||
            (saved === null &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "dark" : "light"
          );
        } catch (e) {
          /* storage blocked; fall back to the CSS media query */
        }
      })();
    </script>
    <!--
      Puts the URL back after a 404.html redirect (see public/404.html).
      Must stay ABOVE the Google Analytics tag below, which reads location on
      init and would otherwise report the wrong page path.
    -->
    <script>
      var redirect = sessionStorage.redirect;
      if (redirect) {
        delete sessionStorage.redirect;
        history.replaceState(null, "", redirect);
      }
    </script>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-HNDQ0E4M5C"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-HNDQ0E4M5C");
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
